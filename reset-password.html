<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#04050a"><title>NEXORA — Reset password</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="auth.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"></head><body class="auth-page"><section class="auth-visual"><div class="auth-grid"></div><div class="auth-copy"><a class="auth-brand" href="index.html"><i class="auth-mark"></i>NEXORA</a><div class="auth-kicker">IDENTITY / 04</div><h1>REBUILD<br>YOUR<br><span class="outline">KEY.</span></h1><p>Choose a new password. Recovery links are single-use and expire for your security.</p></div></section><main class="auth-side"><div class="auth-card"><a class="auth-back" href="login.html">← BACK TO LOGIN</a><header class="auth-head"><h2>New password</h2><p>Set a strong password for your account.</p></header><form class="auth-form" id="resetForm" novalidate><div class="field"><label for="newPassword">New password</label><div class="input-wrap"><input id="newPassword" type="password" autocomplete="new-password" required placeholder="Create a strong password"><button class="password-toggle" type="button" data-password-toggle="#newPassword">SHOW</button></div></div><div class="field"><label for="confirmPassword">Confirm password</label><div class="input-wrap"><input id="confirmPassword" type="password" autocomplete="new-password" required placeholder="Repeat your password"><button class="password-toggle" type="button" data-password-toggle="#confirmPassword">SHOW</button></div></div><div class="auth-message" id="formMessage" aria-live="polite"></div><button class="auth-submit" id="submitBtn" type="submit"><span data-label>UPDATE PASSWORD</span><span class="auth-loading spinner"></span></button></form><div class="auth-foot">Need a new recovery email? <a class="auth-link" href="forgot-password.html">Request one</a></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth-config.js"></script><script src="auth.js" defer></script></body></html>
