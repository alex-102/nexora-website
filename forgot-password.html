<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#04050a"><title>NEXORA — Recover access</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="auth.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"></head><body class="auth-page"><section class="auth-visual"><div class="auth-grid"></div><div class="auth-copy"><a class="auth-brand" href="index.html"><i class="auth-mark"></i>NEXORA</a><div class="auth-kicker">IDENTITY / RECOVERY</div><h1>RECOVER<br>YOUR<br><span class="outline">ACCESS.</span></h1><p>We'll send a secure, single-use link if an account is associated with the address you provide.</p></div></section><main class="auth-side"><div class="auth-card"><a class="auth-back" href="login.html">← BACK TO LOGIN</a><header class="auth-head"><h2>Forgot password?</h2><p>Enter your email and we'll send recovery instructions.</p></header><form class="auth-form" id="forgotForm" novalidate><div class="field"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required placeholder="you@example.com"></div><div class="auth-message" id="formMessage" aria-live="polite"></div><button class="auth-submit" id="submitBtn" type="submit"><span data-label>SEND RESET LINK</span><span class="auth-loading spinner"></span></button></form><div class="auth-foot">Remembered your password? <a class="auth-link" href="login.html">Sign in</a></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth-config.js"></script><script src="auth.js" defer></script></body></html>
